name: Build 02 Blocker

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/gare/callblock

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CallBlock"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.gare.callblock"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.gare.callblock"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="02 Blocker"
                  android:icon="@android:drawable/ic_menu_call">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockService"
                      android:exported="true"
                      android:permission="android.permission.BIND_SCREENING_SERVICE">
                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/gare/callblock/BlockService.kt <<'EOF'
          package com.gare.callblock

          import android.telecom.Call
          import android.telecom.CallScreeningService
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class BlockService : CallScreeningService() {

              // Edit to change what gets blocked, e.g. listOf("0201")
              private val blockedPrefixes = listOf("02")

              // Numbers that should always get through (local format)
              private val allowList = setOf<String>(
                  // "02012345678",
              )

              override fun onScreenCall(details: Call.Details) {
                  val raw = details.handle?.schemeSpecificPart.orEmpty()
                  val number = normalise(raw)
                  val outgoing = details.callDirection == Call.Details.DIRECTION_OUTGOING

                  val shouldBlock = !outgoing &&
                      number !in allowList &&
                      blockedPrefixes.any { number.startsWith(it) }

                  val response = if (shouldBlock) {
                      CallResponse.Builder()
                          .setDisallowCall(true)
                          .setRejectCall(true)
                          .setSkipNotification(true)
                          .setSkipCallLog(false)
                          .build()
                  } else {
                      CallResponse.Builder().build()
                  }
                  respondToCall(details, response)

                  val tag = when {
                      outgoing -> "outgoing"
                      shouldBlock -> "BLOCKED "
                      else -> "allowed "
                  }
                  record(tag + "  " + raw.ifEmpty { "(hidden)" })
              }

              private fun normalise(raw: String): String {
                  val n = raw.filter { it.isDigit() || it == '+' }
                  return when {
                      n.startsWith("+234") -> "0" + n.removePrefix("+234").removePrefix("0")
                      n.startsWith("00234") -> "0" + n.removePrefix("00234").removePrefix("0")
                      n.startsWith("234") && n.length >= 13 -> "0" + n.removePrefix("234").removePrefix("0")
                      n.startsWith("+44") -> "0" + n.removePrefix("+44").removePrefix("0")
                      n.startsWith("0044") -> "0" + n.removePrefix("0044").removePrefix("0")
                      else -> n
                  }
              }

              private fun record(entry: String) {
                  val prefs = getSharedPreferences("log", MODE_PRIVATE)
                  val time = SimpleDateFormat("dd MMM HH:mm", Locale.UK).format(Date())
                  val old = prefs.getString("entries", "").orEmpty()
                  val updated = (time + "  " + entry + "\n" + old).lines().take(30).joinToString("\n")
                  prefs.edit().putString("entries", updated).apply()
              }
          }
          EOF

          cat > app/src/main/java/com/gare/callblock/MainActivity.kt <<'EOF'
          package com.gare.callblock

          import android.app.Activity
          import android.app.role.RoleManager
          import android.os.Bundle
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var label: TextView
              private val role = RoleManager.ROLE_CALL_SCREENING

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  label = TextView(this).apply {
                      textSize = 16f
                      setPadding(48, 96, 48, 48)
                      setTextIsSelectable(true)
                  }
                  setContentView(ScrollView(this).apply { addView(label) })

                  val roleManager = getSystemService(RoleManager::class.java)
                  if (!roleManager.isRoleHeld(role)) {
                      startActivityForResult(roleManager.createRequestRoleIntent(role), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val held = getSystemService(RoleManager::class.java).isRoleHeld(role)
                  val status = if (held) "Status: ACTIVE"
                               else "Status: NOT ACTIVE\nClose and reopen the app, then tap Allow."
                  val log = getSharedPreferences("log", MODE_PRIVATE)
                      .getString("entries", "").orEmpty()
                      .ifEmpty { "No calls seen yet." }
                  label.text = status + "\n\nCalls this app has seen:\n\n" + log
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk 02-blocker.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 02 Blocker build ${{ github.run_number }}
          files: 02-blocker.apk
          
