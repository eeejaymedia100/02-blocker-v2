name: Build Toolkit

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Creates a signing key on the first run and saves it in the repo,
      # so future updates install over the old app (no more uninstalling).
      - name: Signing key
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Toolkit,O=GARE,C=NG"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/debug.keystore
            git commit -m "Add signing key"
            git push
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate project
        run: |
          SRC=app/src/main/java/com/gare/callblock
          mkdir -p $SRC

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Toolkit"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.gare.callblock"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.gare.callblock"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 4
                  versionName = "3.1"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file("keystore/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              packaging {
                  jniLibs { useLegacyPackaging = true }
                  resources {
                      excludes += setOf("META-INF/DEPENDENCIES", "META-INF/LICENSE*",
                                        "META-INF/NOTICE*", "**/module-info.class")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("io.github.junkfood02.youtubedl-android:library:0.18.1")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:label="Toolkit"
                  android:icon="@android:drawable/ic_menu_manage">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".BlockerActivity" android:label="Call Blocker" />
                  <activity android:name=".DataUsageActivity" android:label="Data Usage" />

                  <activity
                      android:name=".DownloaderActivity"
                      android:label="Download with Toolkit"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BlockService"
                      android:exported="true"
                      android:permission="android.permission.BIND_SCREENING_SERVICE">
                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # ---------- Shared UI helpers ----------
          cat > $SRC/Ui.kt <<'EOF'
          package com.gare.callblock

          import android.app.Activity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          fun Activity.page(build: LinearLayout.() -> Unit): LinearLayout {
              val col = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(48, 64, 48, 64)
                  build()
              }
              setContentView(ScrollView(this).apply { addView(col) })
              return col
          }

          fun LinearLayout.row(build: LinearLayout.() -> Unit): LinearLayout =
              LinearLayout(context).apply {
                  orientation = LinearLayout.HORIZONTAL
                  build()
              }.also { addView(it) }

          fun LinearLayout.text(s: String, size: Float = 16f): TextView =
              TextView(context).apply {
                  text = s
                  textSize = size
                  setPadding(0, 16, 0, 16)
                  setTextIsSelectable(true)
              }.also { addView(it) }

          fun LinearLayout.button(label: String, onClick: () -> Unit): Button =
              Button(context).apply {
                  text = label
                  isAllCaps = false
                  setOnClickListener { onClick() }
              }.also { addView(it) }
          EOF

          # ---------- Home screen ----------
          cat > $SRC/MainActivity.kt <<'EOF'
          package com.gare.callblock

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle

          class MainActivity : Activity() {

              // To add a tool: add one line here + create its Activity + list it in the manifest.
              private val tools = listOf(
                  Triple("📵  Call Blocker", "Block calls by prefix and see what was blocked", BlockerActivity::class.java),
                  Triple("📊  Data Usage", "See which apps are using your data", DataUsageActivity::class.java),
                  Triple("⬇️  Downloader", "Download videos or audio from links", DownloaderActivity::class.java),
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  page {
                      text("Toolkit", 26f)
                      for ((name, desc, screen) in tools) {
                          button(name) { startActivity(Intent(this@MainActivity, screen)) }
                          text(desc, 13f)
                      }
                  }
              }
          }
          EOF

          # ---------- Call Blocker ----------
          cat > $SRC/BlockerActivity.kt <<'EOF'
          package com.gare.callblock

          import android.app.Activity
          import android.app.role.RoleManager
          import android.os.Bundle
          import android.widget.TextView

          class BlockerActivity : Activity() {

              private val role = RoleManager.ROLE_CALL_SCREENING
              private lateinit var status: TextView
              private lateinit var log: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  page {
                      text("Call Blocker", 22f)
                      status = text("")
                      button("Turn on blocking") {
                          val rm = getSystemService(RoleManager::class.java)
                          startActivityForResult(rm.createRequestRoleIntent(role), 1)
                      }
                      button("Clear log") {
                          getSharedPreferences("log", MODE_PRIVATE).edit().clear().apply()
                          refresh()
                      }
                      text("Calls this app has seen:")
                      log = text("")
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  val held = getSystemService(RoleManager::class.java).isRoleHeld(role)
                  status.text = if (held) "Status: ACTIVE ✅" else "Status: NOT ACTIVE. Tap Turn on blocking."
                  log.text = getSharedPreferences("log", MODE_PRIVATE)
                      .getString("entries", "").orEmpty()
                      .ifEmpty { "No calls seen yet." }
              }
          }
          EOF

          cat > $SRC/BlockService.kt <<'EOF'
          package com.gare.callblock

          import android.telecom.Call
          import android.telecom.CallScreeningService
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class BlockService : CallScreeningService() {

              // Edit to change what gets blocked, e.g. listOf("0201")
              private val blockedPrefixes = listOf("02")

              // Numbers that should always get through (local format)
              private val allowList = setOf<String>(
                  // "02012345678",
              )

              override fun onScreenCall(details: Call.Details) {
                  val raw = details.handle?.schemeSpecificPart.orEmpty()
                  val number = normalise(raw)
                  val outgoing = details.callDirection == Call.Details.DIRECTION_OUTGOING

                  val shouldBlock = !outgoing &&
                      number !in allowList &&
                      blockedPrefixes.any { number.startsWith(it) }

                  val response = if (shouldBlock) {
                      CallResponse.Builder()
                          .setDisallowCall(true)
                          .setRejectCall(true)
                          .setSkipNotification(true)
                          .setSkipCallLog(false)
                          .build()
                  } else {
                      CallResponse.Builder().build()
                  }
                  respondToCall(details, response)

                  val tag = when {
                      outgoing -> "outgoing"
                      shouldBlock -> "BLOCKED "
                      else -> "allowed "
                  }
                  record(tag + "  " + raw.ifEmpty { "(hidden)" })
              }

              private fun normalise(raw: String): String {
                  val n = raw.filter { it.isDigit() || it == '+' }
                  return when {
                      n.startsWith("+234") -> "0" + n.removePrefix("+234").removePrefix("0")
                      n.startsWith("00234") -> "0" + n.removePrefix("00234").removePrefix("0")
                      n.startsWith("234") && n.length >= 13 -> "0" + n.removePrefix("234").removePrefix("0")
                      n.startsWith("+44") -> "0" + n.removePrefix("+44").removePrefix("0")
                      n.startsWith("0044") -> "0" + n.removePrefix("0044").removePrefix("0")
                      else -> n
                  }
              }

              private fun record(entry: String) {
                  val prefs = getSharedPreferences("log", MODE_PRIVATE)
                  val time = SimpleDateFormat("dd MMM HH:mm", Locale.UK).format(Date())
                  val old = prefs.getString("entries", "").orEmpty()
                  val updated = (time + "  " + entry + "\n" + old).lines().take(50).joinToString("\n")
                  prefs.edit().putString("entries", updated).apply()
              }
          }
          EOF

          # ---------- Data Usage ----------
          cat > $SRC/DataUsageActivity.kt <<'EOF'
          package com.gare.callblock

          import android.app.Activity
          import android.app.AppOpsManager
          import android.app.usage.NetworkStats
          import android.app.usage.NetworkStatsManager
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import android.widget.TextView
          import java.util.Calendar
          import java.util.Locale

          class DataUsageActivity : Activity() {

              private lateinit var out: TextView
              private var network = ConnectivityManager.TYPE_MOBILE
              private var days = 1

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  page {
                      text("Data Usage", 22f)
                      row {
                          button("Mobile") { network = ConnectivityManager.TYPE_MOBILE; refresh() }
                          button("Wi-Fi") { network = ConnectivityManager.TYPE_WIFI; refresh() }
                      }
                      row {
                          button("Today") { days = 1; refresh() }
                          button("7 days") { days = 7; refresh() }
                          button("30 days") { days = 30; refresh() }
                      }
                      button("Grant usage access") {
                          startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                      }
                      out = text("")
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun hasAccess(): Boolean {
                  val ops = getSystemService(AppOpsManager::class.java)
                  return ops.unsafeCheckOpNoThrow(
                      AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName
                  ) == AppOpsManager.MODE_ALLOWED
              }

              private fun refresh() {
                  if (!hasAccess()) {
                      out.text = "Needs Usage access.\n\nTap Grant usage access, find Toolkit, turn it on, then come back."
                      return
                  }
                  out.text = "Loading…"
                  Thread {
                      val result = try { report() } catch (e: Exception) { "Error: " + e.message }
                      runOnUiThread { out.text = result }
                  }.start()
              }

              private fun report(): String {
                  val end = System.currentTimeMillis()
                  val start = if (days == 1) {
                      Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0)
                          set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                      }.timeInMillis
                  } else end - days * 86_400_000L

                  val nsm = getSystemService(NetworkStatsManager::class.java)
                  val stats = nsm.querySummary(network, null, start, end)
                  val fg = HashMap<Int, Long>()
                  val bg = HashMap<Int, Long>()
                  val b = NetworkStats.Bucket()
                  while (stats.hasNextBucket()) {
                      stats.getNextBucket(b)
                      val map = if (b.state == NetworkStats.Bucket.STATE_FOREGROUND) fg else bg
                      map[b.uid] = (map[b.uid] ?: 0L) + b.rxBytes + b.txBytes
                  }
                  stats.close()

                  val rows = (fg.keys + bg.keys).distinct()
                      .map { uid -> Triple(uid, fg[uid] ?: 0L, bg[uid] ?: 0L) }
                      .filter { it.second + it.third > 0 }
                      .sortedByDescending { it.second + it.third }
                  val total = rows.sumOf { it.second + it.third }

                  val net = if (network == ConnectivityManager.TYPE_MOBILE) "Mobile data" else "Wi-Fi"
                  val period = if (days == 1) "today" else "last " + days + " days"
                  val sb = StringBuilder(net + ", " + period + "\nTotal: " + fmt(total) + "\n\n")
                  for ((uid, f, bgBytes) in rows.take(30)) {
                      sb.append(appName(uid)).append("\n")
                      sb.append("   ").append(fmt(f + bgBytes))
                        .append("   (background ").append(fmt(bgBytes)).append(")\n\n")
                  }
                  return sb.toString()
              }

              private fun appName(uid: Int): String = when (uid) {
                  NetworkStats.Bucket.UID_REMOVED -> "Uninstalled apps"
                  NetworkStats.Bucket.UID_TETHERING -> "Hotspot / tethering"
                  Process.SYSTEM_UID -> "Android system"
                  0 -> "Android system (core)"
                  else -> {
                      val pkgs = packageManager.getPackagesForUid(uid)
                      if (pkgs.isNullOrEmpty()) "Unknown app (uid " + uid + ")"
                      else try {
                          val info = packageManager.getApplicationInfo(pkgs[0], 0)
                          packageManager.getApplicationLabel(info).toString() +
                              (if (pkgs.size > 1) " + " + (pkgs.size - 1) + " shared" else "")
                      } catch (e: Exception) { pkgs[0] }
                  }
              }

              private fun fmt(b: Long): String = when {
                  b >= 1073741824L -> String.format(Locale.UK, "%.2f GB", b / 1073741824.0)
                  b >= 1048576L -> String.format(Locale.UK, "%.1f MB", b / 1048576.0)
                  b >= 1024L -> String.format(Locale.UK, "%.0f KB", b / 1024.0)
                  else -> b.toString() + " B"
              }
          }
          EOF

          # ---------- Downloader (yt-dlp) ----------
          cat > $SRC/DownloaderActivity.kt <<'EOF'
          package com.gare.callblock

          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.webkit.MimeTypeMap
          import android.widget.EditText
          import android.widget.TextView
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File

          class DownloaderActivity : Activity() {

              companion object {
                  @Volatile var ready = false
                  @Volatile var busy = false
              }

              private lateinit var input: EditText
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  page {
                      text("Downloader", 22f)
                      text("Paste a link, or in any app tap Share, then Download with Toolkit.", 13f)
                      input = EditText(context).apply {
                          hint = "https://…"
                          isSingleLine = true
                      }.also { addView(it) }
                      row {
                          button("Video") { download(false) }
                          button("Audio (mp3)") { download(true) }
                      }
                      row {
                          button("Update yt-dlp") { update(false) }
                          button("Nightly") { update(true) }
                      }
                      status = text("Files save to Download/Toolkit")
                  }
                  handleShare(intent)
              }

              private fun handleShare(i: Intent?) {
                  if (i?.action != Intent.ACTION_SEND) return
                  val shared = i.getStringExtra(Intent.EXTRA_TEXT).orEmpty()
                  val url = Regex("https?://\\S+").find(shared)?.value
                  if (url == null) {
                      status.text = "No link found in what was shared."
                  } else {
                      input.setText(url)
                      download(false)
                  }
              }

              private fun ensureReady() {
                  if (ready) return
                  YoutubeDL.getInstance().init(applicationContext)
                  FFmpeg.getInstance().init(applicationContext)
                  ready = true
              }

              private fun download(audioOnly: Boolean) {
                  val url = input.text.toString().trim()
                  if (!url.startsWith("http")) { status.text = "Paste a valid link first."; return }
                  if (busy) { status.text = "Busy, wait for the current job to finish."; return }
                  busy = true
                  status.text = "Starting… (first run takes a bit longer)"

                  Thread {
                      val msg = try {
                          ensureReady()
                          val tmp = File(cacheDir, "dl").apply { deleteRecursively(); mkdirs() }
                          val req = YoutubeDLRequest(url).apply {
                              addOption("-o", tmp.absolutePath + "/%(title).80s [%(id)s].%(ext)s")
                              addOption("--no-mtime")
                              addOption("--no-playlist")
                              if (audioOnly) {
                                  addOption("-x")
                                  addOption("--audio-format", "mp3")
                              } else {
                                  addOption("-f", "bv*+ba/b")
                                  addOption("--merge-output-format", "mp4")
                              }
                          }
                          YoutubeDL.getInstance().execute(req) { progress, eta, _ ->
                              val pct = progress.coerceAtLeast(0f).toInt()
                              runOnUiThread { status.text = "Downloading… " + pct + "%  (" + eta + "s left)" }
                          }
                          val files = tmp.listFiles().orEmpty().filter {
                              it.isFile && !it.name.endsWith(".part") && !it.name.endsWith(".ytdl")
                          }
                          val saved = files.map { saveToDownloads(it) }
                          if (saved.isEmpty()) "Finished, but no file was produced."
                          else "✅ Saved to Download/Toolkit:\n\n" + saved.joinToString("\n")
                      } catch (e: Exception) {
                          "❌ Failed: " + (e.message ?: e.toString()).take(500) +
                              (e.cause?.let { "\nReason: " + it.message } ?: "") +
                              "\n\nTip: tap Update yt-dlp, then try again."
                      }
                      busy = false
                      runOnUiThread { status.text = msg }
                  }.start()
              }

              private fun saveToDownloads(f: File): String {
                  val mime = MimeTypeMap.getSingleton()
                      .getMimeTypeFromExtension(f.extension.lowercase()) ?: "application/octet-stream"
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, f.name)
                      put(MediaStore.MediaColumns.MIME_TYPE, mime)
                      put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Toolkit")
                  }
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: error("Could not create file in Downloads")
                  contentResolver.openOutputStream(uri)!!.use { out -> f.inputStream().use { it.copyTo(out) } }
                  f.delete()
                  return f.name
              }

              private fun update(nightly: Boolean) {
                  if (busy) { status.text = "Busy, try again in a moment."; return }
                  busy = true
                  status.text = if (nightly) "Updating yt-dlp (nightly)…" else "Updating yt-dlp…"
                  Thread {
                      val msg = try {
                          ensureReady()
                          val channel = if (nightly) YoutubeDL.UpdateChannel.NIGHTLY else YoutubeDL.UpdateChannel.STABLE
                          val result = YoutubeDL.getInstance().updateYoutubeDL(applicationContext, channel)
                          "yt-dlp update" + (if (nightly) " (nightly)" else "") + ": " + (result?.name ?: "done") +
                              "\nVersion: " + (YoutubeDL.getInstance().version(applicationContext) ?: "?")
                      } catch (e: Exception) {
                          "Update failed: " + e.message + (e.cause?.let { "\nReason: " + it.message } ?: "")
                      }
                      busy = false
                      runOnUiThread { status.text = msg }
                  }.start()
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk toolkit.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Toolkit build ${{ github.run_number }}
          files: toolkit.apk
